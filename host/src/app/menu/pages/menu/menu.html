<mat-sidenav-container class="container">
  <mat-sidenav mode="side" [opened]="opened()" class="sidenav">
    <mat-nav-list>
      <a mat-list-item (click)="goHome()">
        <mat-icon matListItemIcon>home</mat-icon>
        <span class="item-menu">Home</span>
      </a>

      <a mat-list-item (click)="goStudents()">
        <mat-icon matListItemIcon>person</mat-icon>
        <span class="item-menu">Students</span>
      </a>

      <a mat-list-item (click)="goAcademicPeriods()">
        <mat-icon matListItemIcon>date_range</mat-icon>
        <span class="item-menu">Academic / Periods</span>
      </a>

      <a mat-list-item (click)="goAcademicClasses()">
        <mat-icon matListItemIcon>class</mat-icon>
        <span class="item-menu">Academic / Classes</span>
      </a>

      <a mat-list-item (click)="goEnrollmentNew()">
        <mat-icon matListItemIcon>assignment</mat-icon>
        <span class="item-menu">Enrollment / New</span>
      </a>

      <a mat-list-item (click)="goEnrollmentSearch()">
        <mat-icon matListItemIcon>search</mat-icon>
        <span class="item-menu">Enrollment / Search</span>
      </a>

      <a mat-list-item (click)="goUserManagement()">
        <mat-icon matListItemIcon>manage_accounts</mat-icon>
        <span class="item-menu">User management</span>
      </a>

      <a mat-list-item (click)="openMicrofrontend()">
        <mat-icon matListItemIcon>apps</mat-icon>
        <span class="item-menu">Microfrontend</span>
      </a>

      <a mat-list-item (click)="signOut()">
        <mat-icon matListItemIcon>logout</mat-icon>
        <span class="item-menu">Sign out</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="toolbar-gradient">
      <button mat-icon-button (click)="toggleMenu()">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="title">Host</span>

      <div class="toolbar-right">
        <span class="data-hora">
          {{ dataHoraFormatada }}
        </span>
      </div>
    </mat-toolbar>

    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
